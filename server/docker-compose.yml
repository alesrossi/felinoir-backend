services:

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  cinema-frontend:
    image: alesrossi/cinema-frontend:latest
    container_name: cinema
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://cinema-backend:3001
      VIRTUAL_HOST: felinoir.it,www.felinoir.it,cinema-roma.alessandrorossi.tech
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: felinoir.it,www.felinoir.it,cinema-roma.alessandrorossi.tech
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    depends_on:
      cinema-backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - proxy
      - cinema_internal

  # ── Legacy Next.js frontend (temporary) ───────────────────────────────────────
  # Served at https://old.felinoir.it via nginx-proxy (TLS by letsencrypt companion).
  # Requires a DNS A record for old.felinoir.it pointing at this server.
  cinema-frontend-old:
    image: alesrossi/cinema-frontend:old
    container_name: cinema-old
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://cinema-backend:3001
      VIRTUAL_HOST: old.felinoir.it
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: old.felinoir.it
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    depends_on:
      cinema-backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - proxy
      - cinema_internal

  # ── Schema migrator ───────────────────────────────────────────────────────────
  # One-shot: brings the database to the current schema, then exits (ADR 0001).
  # The backend and the scraper only start once it has succeeded; a scraper run
  # (`docker compose run --rm cinema-scraper`) runs it first too.
  cinema-migrator:
    image: alesrossi/cinema-backend-migrator:latest
    container_name: cinema-migrator
    restart: "no"
    environment:
      DATABASE_URL: postgres://cinema:cinema@db:5432/cinema
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinema_internal

  # ── REST API ──────────────────────────────────────────────────────────────────
  cinema-backend:
    image: alesrossi/cinema-backend:latest
    container_name: cinema-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://cinema:cinema@db:5432/cinema
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Readable lines on the console (docker logs); ECS JSON files for Alloy -> Loki (logs/backend,
      # rolled daily and at 100 MB, at most a month / 5 GB kept).
      LOG_FILE_PATH: /app/logs/felinoir-api-.json
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      cinema-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3001 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cinema_internal

  # ── Scraper ───────────────────────────────────────────────────────────────────
  # Triggered by daily-report.sh via: docker compose run --rm cinema-scraper
  cinema-scraper:
    image: alesrossi/cinema-scrapers:latest
    container_name: cinema-scraper
    restart: "no"
    environment:
      DATABASE_URL: postgres://cinema:cinema@db:5432/cinema
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      OMDB_API_KEY: ${OMDB_API_KEY}
      # AI match verification (npm run enrich:ai); the step is skipped when unset
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      USE_PROXY: ${USE_PROXY:-false}
      PROXY_URL: ${PROXY_URL:-}
    depends_on:
      cinema-migrator:
        condition: service_completed_successfully
      flaresolverr:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command:
      - sh
      - -c
      - |
        mkdir -p /app/logs
        log=/app/logs/scraper.log
        echo "=== $$(date -u '+%Y-%m-%d %H:%M:%S UTC') ===" | tee -a $$log

        { npm run scrape 2>&1;      echo $$? > /tmp/s1_exit; } | tee /tmp/s1.txt | tee -a $$log
        { npm run enrich 2>&1;      echo $$? > /tmp/s2_exit; } | tee /tmp/s2.txt | tee -a $$log
        { npm run enrich:ai 2>&1;   echo $$? > /tmp/s3_exit; } | tee /tmp/s3.txt | tee -a $$log
        { npm run enrich:omdb 2>&1; echo $$? > /tmp/s4_exit; } | tee /tmp/s4.txt | tee -a $$log

        E1=$$(cat /tmp/s1_exit 2>/dev/null || echo '?')
        E2=$$(cat /tmp/s2_exit 2>/dev/null || echo '?')
        E3=$$(cat /tmp/s3_exit 2>/dev/null || echo '?')
        E4=$$(cat /tmp/s4_exit 2>/dev/null || echo '?')

        {
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  PIPELINE SUMMARY — $$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "═══════════════════════════════════════════════════════════════"

          echo ""
          echo "── 1. SCRAPE (exit $$E1) ───────────────────────────────────────"
          L=$$(grep -n "Scrape summary" /tmp/s1.txt 2>/dev/null | tail -1 | cut -d: -f1)
          [ -n "$$L" ] && tail -n +"$$L" /tmp/s1.txt || echo "  (no summary)"

          echo ""
          echo "── 2. TMDB ENRICHMENT (exit $$E2) ──────────────────────────────"
          L=$$(grep -n "Summary" /tmp/s2.txt 2>/dev/null | tail -1 | cut -d: -f1)
          [ -n "$$L" ] && tail -n +"$$L" /tmp/s2.txt || echo "  (no summary)"

          echo ""
          echo "── 3. AI VERIFICATION (exit $$E3) ─────────────────────────────"
          L=$$(grep -n "Summary" /tmp/s3.txt 2>/dev/null | tail -1 | cut -d: -f1)
          [ -n "$$L" ] && tail -n +"$$L" /tmp/s3.txt || tail -n 3 /tmp/s3.txt
        
          echo ""
          echo "── 4. OMDB ENRICHMENT (exit $$E4) ──────────────────────────────"
          L=$$(grep -n "Summary" /tmp/s4.txt 2>/dev/null | tail -1 | cut -d: -f1)
          [ -n "$$L" ] && tail -n +"$$L" /tmp/s4.txt || echo "  (no summary)"

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
        } | tee -a $$log
    networks:
      - cinema_internal

  # ── FlareSolverr ──────────────────────────────────────────────────────────────
  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - cinema_internal

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cinema_internal

  # ── CloudBeaver (DB management UI) ────────────────────────────────────────────
  # Exposed via nginx-proxy at https://db.felinoir.it (TLS by letsencrypt companion).
  # Requires a DNS A record for db.felinoir.it pointing at this server.
  # First launch runs the admin setup wizard; then add a PostgreSQL connection
  # to host "db", port 5432, database/user/password all "cinema".
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: db.felinoir.it
      VIRTUAL_PORT: 8978
      LETSENCRYPT_HOST: db.felinoir.it
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
      CB_SERVER_URL: https://db.felinoir.it
    expose:
      - "8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - cinema_internal

  # ── Logs: Loki + Alloy + Grafana ──────────────────────────────────────────────
  # Alloy ships logs/backend/*.json (the API) and logs/scraper.log to Loki; Grafana shows them at
  # https://logs.felinoir.it (requires a DNS A record for logs.felinoir.it). Loki keeps 31 days,
  # and log-retention keeps it under LOG_RETENTION_MAX_MB. About 400 MB of RAM in all.
  # The config files are mounted with create_host_path: false, so a missing file stops the service
  # with an error instead of Docker silently creating an empty directory in its place.
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - type: bind
        source: ./logging/loki.yaml
        target: /etc/loki/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - loki_data:/loki
    mem_limit: 512m
    networks:
      - logging

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - type: bind
        source: ./logging/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - ./logs:/logs:ro
      - alloy_data:/var/lib/alloy/data   # how far each file has been read
    mem_limit: 256m
    depends_on:
      - loki
    networks:
      - logging

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: logs.felinoir.it
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: logs.felinoir.it
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
      GF_SERVER_ROOT_URL: https://logs.felinoir.it
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      LOKI_URL: http://loki:3100
    volumes:
      - type: bind
        source: ./logging/grafana/datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
        read_only: true
        bind:
          create_host_path: false
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    mem_limit: 384m
    depends_on:
      - loki
    networks:
      - proxy
      - logging

  log-retention:
    image: curlimages/curl:8.17.0
    container_name: log-retention
    restart: unless-stopped
    entrypoint: ["sh", "/retention.sh"]
    environment:
      LOKI_URL: http://loki:3100
      LOG_RETENTION_MAX_MB: ${LOG_RETENTION_MAX_MB:-5120}
    volumes:
      - type: bind
        source: ./logging/retention.sh
        target: /retention.sh
        read_only: true
        bind:
          create_host_path: false
      - loki_data:/loki:ro
    mem_limit: 32m
    depends_on:
      - loki
    networks:
      - logging

networks:
  proxy:
    external: true
  cinema_internal:
    name: cinema_internal
  logging:
    name: felinoir_logging

volumes:
  postgres_data:
  cloudbeaver_data:
  loki_data:
  alloy_data:
  grafana_data:
