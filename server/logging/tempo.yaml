# Tempo (the tempo service): one process, traces on the local disk (the tempo_data volume).
# Alloy forwards the OTLP traces of the API and the frontend here; Grafana reads them on :3200.
# Traces are kept 7 days: a few MB a day at Felinoir's traffic.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m   # small blocks: little memory held, traces searchable sooner

compactor:
  compaction:
    block_retention: 168h  # 7 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
